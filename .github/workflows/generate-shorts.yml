name: Generate Shorts V3

on:
  workflow_dispatch:

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install
        run: npm install


      - name: Generate AI Script
        run: npm run generate

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
