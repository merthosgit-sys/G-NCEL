name: Generate Shorts V3


on:

  workflow_dispatch:

    inputs:

      topic:

        description: "Ana konu"

        required: true

        default: "teknoloji tarihi"



      count:

        description: "Kaç Shorts üretilecek"

        required: true

        default: "3"



jobs:


  generate:


    runs-on: ubuntu-latest


    env:

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      SHORTS_TOPIC: ${{ inputs.topic }}

      SHORTS_COUNT: ${{ inputs.count }}



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 22



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install FFmpeg

        run: |

          sudo apt update

          sudo apt install -y ffmpeg



      - name: Install packages

        run: |

          npm install



      - name: Install Piper

        run: |

          pip install piper-tts



      - name: Download Voice

        run: |

          mkdir -p voices

          python -m piper.download_voices \
            tr_TR-dfki-medium \
            --data-dir voices



      - name: Create folders

        run: |

          mkdir -p output/final

          mkdir -p output/cache



      - name: Generate Shorts

        run: |

          npm run generate



      - name: Upload videos

        uses: actions/upload-artifact@v4

        with:

          name: shorts-output

          path: output/final/
