name: Generate Shorts V3


on:

  workflow_dispatch:

    inputs:

      topic:

        description: "Video konusu"

        required: true

        default: "arabalar hakkında ilginç bilgiler"


      count:

        description: "Video sayısı"

        required: true

        default: "3"



jobs:


  generate:


    runs-on: ubuntu-latest


    env:

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      SHORTS_TOPIC: ${{ inputs.topic }}

      SHORTS_COUNT: ${{ inputs.count }}



    steps:



      - name: Checkout

        uses: actions/checkout@v4



      - name: Node Setup

        uses: actions/setup-node@v4

        with:

          node-version: 22



      - name: Python Setup

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install FFmpeg

        run: |

          sudo apt update

          sudo apt install -y ffmpeg



      - name: Install Node Packages

        run: |

          npm install



      - name: Install Python AI Tools

        run: |

          python -m pip install --upgrade pip

          pip install piper-tts

          pip install openai-whisper

          pip install setuptools

          pip install wheel



      - name: Install Whisper Check

        run: |

          python -m whisper --help



      - name: Download Turkish Voices

        run: |

          mkdir -p voices


          python -m piper.download_voices \
            tr_TR-dfki-medium \
            --data-dir voices


          python -m piper.download_voices \
            tr_TR-fettah-medium \
            --data-dir voices



      - name: Prepare folders

        run: |

          mkdir -p output/final

          mkdir -p output/work

          mkdir -p output/audio



      - name: Generate Shorts

        run: |

          npm run generate



      - name: Show Output

        run: |

          ls -R output



      - name: Upload Final Videos

        uses: actions/upload-artifact@v4

        with:

          name: shorts-final

          path: output/final/*.mp4

          if-no-files-found: error
