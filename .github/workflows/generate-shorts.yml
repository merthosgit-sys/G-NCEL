name: Generate Shorts V3


on:

  workflow_dispatch:



jobs:


  generate:


    runs-on: ubuntu-latest


    env:

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}



    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Restore AI Cache
        uses: actions/cache@v4

        with:

          path: output/cache

          key: shorts-ai-cache-${{ github.ref }}



      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:

          node-version: 22



      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install FFmpeg
        run: |

          sudo apt update

          sudo apt install -y ffmpeg



      - name: Install Node Dependencies
        run: |

          npm install



      - name: Install Piper TTS
        run: |

          python -m pip install --upgrade pip

          pip install piper-tts



      - name: Download Turkish Piper Voice
        run: |

          mkdir -p voices

          python -m piper.download_voices \
            tr_TR-dfki-medium \
            --data-dir voices



      - name: Check API Keys
        run: |

          echo "Checking Gemini API..."

          if [ -z "$GEMINI_API_KEY" ]; then

            echo "GEMINI_API_KEY missing"

            exit 1

          fi



          echo "Checking Pexels API..."

          if [ -z "$PEXELS_API_KEY" ]; then

            echo "PEXELS_API_KEY missing"

            exit 1

          fi



          echo "API keys OK"



      - name: Prepare Output Folders
        run: |

          mkdir -p output/cache

          mkdir -p output/assets

          mkdir -p output/audio

          mkdir -p output/final



      - name: Generate Shorts Pipeline
        run: |

          npm run generate



      - name: Show Generated Files
        run: |

          echo "===== OUTPUT ====="

          find output -type f



      - name: Upload Final Shorts
        uses: actions/upload-artifact@v4

        with:

          name: shorts-final-video

          path: output/
