name: Generate Shorts V4


on:

  workflow_dispatch:

    inputs:

      topic:

        description: "Video konusu"

        required: true

        default: "arabalar hakkında ilginç bilgiler"


      count:

        description: "Video sayısı"

        required: true

        default: "3"




jobs:


  generate:


    runs-on: ubuntu-latest



    env:


      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      SHORTS_TOPIC: ${{ inputs.topic }}

      SHORTS_COUNT: ${{ inputs.count }}






    steps:



      - name: Checkout

        uses: actions/checkout@v4






      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 22






      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"







      - name: Install FFmpeg

        run: |

          sudo apt update

          sudo apt install -y ffmpeg







      - name: Install Node Packages

        run: |

          npm install







      - name: Install AI Packages

        run: |

          python -m pip install --upgrade pip

          pip install piper-tts

          pip install openai-whisper

          pip install TTS

          pip install torch

          pip install torchvision

          pip install torchaudio







      - name: Prepare Piper Voice

        run: |

          mkdir -p voices

          python -m piper.download_voices \
          tr_TR-dfki-medium \
          --data-dir voices







      - name: Create Output Folders

        run: |

          mkdir -p output/final

          mkdir -p output/work

          mkdir -p output/audio







      - name: Check API Keys

        run: |

          echo "Gemini key length: ${#GEMINI_API_KEY}"

          echo "Groq key length: ${#GROQ_API_KEY}"

          echo "Pexels key length: ${#PEXELS_API_KEY}"








      - name: Type Check

        run: |

          npm run typecheck







      - name: Generate Shorts

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          SHORTS_TOPIC: ${{ inputs.topic }}

          SHORTS_COUNT: ${{ inputs.count }}

        run: |

          npm run generate







      - name: Debug Files

        if: always()

        run: |

          echo "===== OUTPUT TREE ====="

          find . -maxdepth 5 -type f | sort







      - name: Upload Debug Artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: shorts-debug

          path: |

            output/**

          if-no-files-found: warn
