name: Generate Shorts V3


on:

  workflow_dispatch:



jobs:


  generate:


    runs-on: ubuntu-latest


    env:

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}



    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Restore AI Cache
        uses: actions/cache@v4

        with:

          path: output/cache

          key: shorts-cache-${{ github.ref }}



      - name: Setup Node
        uses: actions/setup-node@v4

        with:

          node-version: 22



      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install FFmpeg
        run: |

          sudo apt update

          sudo apt install -y ffmpeg



      - name: Install Node Packages
        run: npm install



      - name: Install Piper
        run: |

          python -m pip install --upgrade pip

          pip install piper-tts



      - name: Download Turkish Voice
        run: |

          mkdir -p voices

          python -m piper.download_voices \
            tr_TR-dfki-medium \
            --data-dir voices



      - name: Check Secrets
        run: |

          test -n "$GEMINI_API_KEY"

          test -n "$PEXELS_API_KEY"

          echo "Secrets OK"



      - name: Prepare folders
        run: |

          mkdir -p output/cache

          mkdir -p output/assets

          mkdir -p output/audio

          mkdir -p output/final



      - name: Generate 3 Shorts
        run: |

          npm run generate



      - name: Upload Only Videos
        uses: actions/upload-artifact@v4

        with:

          name: shorts-videos

          path: output/final/**/short.mp4
